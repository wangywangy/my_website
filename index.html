<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg:        #eceae3;
      --surface:   #f5f3ee;
      --border:    #c8c4bb;
      --text:      #1a1a18;
      --muted:     #8a877f;
      --accent:    #1a1a18;
      --nav-bg:    rgba(236, 234, 227, 0.85);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      background: var(--nav-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .logo-box {
      width: 56px;
      height: 56px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }
    .logo-box:hover { border-color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      position: relative;
      transition: color 0.2s;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1px;
      background: var(--accent);
      transition: width 0.25s ease;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a:hover::after { width: 100%; }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 32px 60px;
    }

    /* ── SLIDESHOW ── */
    .slideshow-wrapper {
      position: relative;
      width: min(620px, 90vw);
      margin: 0 auto;
    }

    .slideshow {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 1.5px solid var(--border);
      background: var(--surface);
      overflow: hidden;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateX(30px);
      transition: opacity 0.55s ease, transform 0.55s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    /* Placeholder artwork panels */
    .slide-inner {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .slide:nth-child(1) .slide-inner { background: #e8e5dc; }
    .slide:nth-child(2) .slide-inner { background: #dfe0da; }
    .slide:nth-child(3) .slide-inner { background: #e4dfd7; }

    .slide-placeholder-icon {
      width: 64px;
      height: 64px;
      border: 1.5px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-placeholder-icon svg {
      width: 28px; height: 28px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.2;
    }

    .slide-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── DOTS ── */
    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--muted);
      background: transparent;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
    }
    .dot.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    .dot:hover:not(.active) {
      transform: scale(1.2);
      border-color: var(--accent);
    }

    /* ── SLIDE ARROWS ── */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--surface);
      border: 1.5px solid var(--border);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s, border-color 0.2s;
    }
    .arrow:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    .arrow:hover svg { stroke: var(--bg); }
    .arrow svg {
      width: 16px; height: 16px;
      stroke: var(--text);
      fill: none;
      stroke-width: 1.8;
      transition: stroke 0.2s;
    }
    .arrow-left  { left: -18px; }
    .arrow-right { right: -18px; }

    /* ── FADE IN ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slideshow-wrapper {
      animation: fadeUp 0.7s ease both;
      animation-delay: 0.1s;
      opacity: 0;
    }
    .dots { animation: fadeUp 0.7s ease both; animation-delay: 0.25s; opacity: 0; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="logo-box">LOGO</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#portfolio">Portfolio</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero" id="home">
    <div class="slideshow-wrapper">

      <!-- Left arrow -->
      <button class="arrow arrow-left" aria-label="Previous" onclick="moveSlide(-1)">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <!-- Slideshow -->
      <div class="slideshow" id="slideshow">
        <div class="slide active">
          <div class="slide-inner">
            <div class="slide-placeholder-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9l4-4 4 4 4-6 4 6"/></svg>
            </div>
            <span class="slide-label">Artwork 01</span>
          </div>
        </div>
        <div class="slide">
          <div class="slide-inner">
            <div class="slide-placeholder-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
            </div>
            <span class="slide-label">Artwork 02</span>
          </div>
        </div>
        <div class="slide">
          <div class="slide-inner">
            <div class="slide-placeholder-icon">
              <svg viewBox="0 0 24 24"><polygon points="12 2 19 21 12 17 5 21"/></svg>
            </div>
            <span class="slide-label">Artwork 03</span>
          </div>
        </div>
      </div>

      <!-- Right arrow -->
      <button class="arrow arrow-right" aria-label="Next" onclick="moveSlide(1)">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- Dots -->
    <div class="dots" id="dots">
      <div class="dot active" onclick="goToSlide(0)"></div>
      <div class="dot" onclick="goToSlide(1)"></div>
      <div class="dot" onclick="goToSlide(2)"></div>
    </div>
  </section>

  <footer>
    &copy; 2026 &nbsp;·&nbsp; YOUR NAME &nbsp;·&nbsp; GRAPHIC DESIGN
  </footer>

  <script>
    let current = 0;
    const slides = document.querySelectorAll('.slide');
    const dots   = document.querySelectorAll('.dot');

    function goToSlide(n) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (n + slides.length) % slides.length;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    function moveSlide(dir) { goToSlide(current + dir); }

    // Auto-advance every 4 s
    setInterval(() => moveSlide(1), 4000);
  </script>

</body>
</html>
